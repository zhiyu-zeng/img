<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12">
  <defs>
    <pattern id="diagonal-stripe" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="#0d1117"/>

  <!-- Title -->
  <text x="300" y="35" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Integer Overflow in Buffer Allocation</text>

  <!-- Calculation Box -->
  <rect x="50" y="60" width="500" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="85" fill="#7d8590" font-size="11" text-anchor="middle">ALLOCATION CALCULATION</text>

  <!-- Column positions: label=70, equals=200, value=220, comment=310 -->
  <text x="70" y="115" fill="#e6edf3">rowbytes</text>
  <text x="200" y="115" fill="#7d8590">=</text>
  <text x="220" y="115" fill="#79c0ff">0x40010</text>
  <text x="310" y="115" fill="#7d8590">(262,160 bytes per row)</text>

  <text x="70" y="140" fill="#e6edf3">height</text>
  <text x="200" y="140" fill="#7d8590">=</text>
  <text x="220" y="140" fill="#79c0ff">0x10001</text>
  <text x="310" y="140" fill="#7d8590">(65,537 rows)</text>

  <text x="70" y="165" fill="#e6edf3">rowbytes * height</text>
  <text x="200" y="165" fill="#7d8590">=</text>
  <text x="220" y="165" fill="#f85149">0x400140010</text>
  <text x="340" y="165" fill="#7d8590">(16 GB)</text>
  <text x="400" y="165" fill="#f85149">-></text>
  <text x="425" y="165" fill="#ffa657">0x140010</text>

  <!-- Arrow down -->
  <path d="M300,190 L300,220 M290,210 L300,220 L310,210" stroke="#7d8590" stroke-width="2" fill="none"/>

  <!-- malloc call -->
  <rect x="180" y="230" width="240" height="30" rx="4" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="1"/>
  <text x="300" y="250" fill="#3fb950" font-size="11" text-anchor="middle">malloc(0x140010) = 1.25 MB allocated</text>

  <!-- Arrow down -->
  <path d="M300,270 L300,300 M290,290 L300,300 L310,290" stroke="#7d8590" stroke-width="2" fill="none"/>

  <!-- Memory diagram -->
  <text x="300" y="325" fill="#7d8590" font-size="11" text-anchor="middle">HEAP MEMORY</text>

  <!-- Allocated buffer (small) -->
  <rect x="200" y="340" width="200" height="80" rx="4" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="2"/>
  <text x="300" y="370" fill="#3fb950" font-size="11" text-anchor="middle">Allocated Buffer</text>
  <text x="300" y="390" fill="#3fb950" font-size="10" text-anchor="middle">1.25 MB</text>

  <!-- Write destination (tall, showing overflow) -->
  <rect x="200" y="340" width="200" height="280" rx="4" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Overflow region -->
  <rect x="200" y="420" width="200" height="200" rx="0 0 4 4" fill="url(#diagonal-stripe)"/>

  <!-- Text background for readability -->
  <rect x="210" y="490" width="180" height="45" rx="3" fill="#0d1117" fill-opacity="0.9"/>
  <text x="300" y="512" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">Out-of-Bounds Write</text>
  <text x="300" y="528" fill="#f85149" font-size="10" text-anchor="middle">~16 GB of controlled data</text>

  <!-- Write loop annotation -->
  <path d="M420,380 L450,380 L450,580 L420,580" stroke="#7d8590" stroke-width="1" fill="none"/>
  <text x="460" y="420" fill="#7d8590" font-size="10">vFillBy16 loop:</text>
  <text x="460" y="440" fill="#e6edf3" font-size="10">for height iterations:</text>
  <text x="470" y="460" fill="#79c0ff" font-size="10">memset_pattern16(dst,</text>
  <text x="480" y="475" fill="#79c0ff" font-size="10">bgcolor, rowbytes)</text>
  <text x="470" y="495" fill="#79c0ff" font-size="10">dst += rowbytes</text>

  <!-- Crash indicator -->
  <rect x="200" y="620" width="200" height="35" rx="4" fill="#f85149" fill-opacity="0.2" stroke="#f85149" stroke-width="2"/>
  <text x="300" y="643" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">EXC_BAD_ACCESS</text>

  <!-- Legend -->
  <rect x="50" y="665" width="12" height="12" fill="#238636" fill-opacity="0.3" stroke="#238636"/>
  <text x="70" y="675" fill="#7d8590" font-size="10">Allocated</text>

  <rect x="140" y="665" width="12" height="12" fill="url(#diagonal-stripe)" stroke="#f85149"/>
  <text x="160" y="675" fill="#7d8590" font-size="10">Overflow (attacker-controlled bytes)</text>
</svg>
