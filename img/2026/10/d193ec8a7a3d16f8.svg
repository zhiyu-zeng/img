     Satori输出编码缺陷（CWE-116）
    </text>
    <text x="705" y="514" fill="#4a5568" text-anchor="middle">
     
     
     
     可控文本 → 被当作SVG标记
    </text>
    <text x="705" y="534" fill="#4a5568" text-anchor="middle">
     
     
     
     CVE-2026-94545 · 注入原语
    </text>
   </g>
