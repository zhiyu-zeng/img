    </rect>
    <text x="375" y="98" fill="#1f2733" text-anchor="middle" font-weight="bold">
     
     
     
     App Router + Cache Components
    </text>
    <text x="375" y="120" fill="#4a5568" text-anchor="middle">
     
     
     
