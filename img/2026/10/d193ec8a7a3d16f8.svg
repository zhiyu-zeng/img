    <text x="705" y="354" fill="#8c2620" text-anchor="middle" font-weight="bold">
     
     
     
     librsvg use-after-free
    </text>
    <text x="705" y="374" fill="#4a5568" text-anchor="middle">
     
     
     
     sharp → libvips → librsvg + libxml2
    </text>
    <text x="705" y="394" fill="#4a5568" text-anchor="middle">
     
     
     
     CVE-2026-96889（VectorFreed）
    </text>
    <rect x="570" y="472" width="270" height="76" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4">
