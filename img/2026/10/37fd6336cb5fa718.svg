 <title>AES-CBC speedup from bipolar encoding</title>
 <desc>Median paired speedups and 95 percent crossed bootstrap intervals compare an S-box-only bipolar encoding and a fully bipolar state against the binary circuit. The dashed reference is one. The workload is 32 messages of 16 blocks under compiled MPS.</desc>
