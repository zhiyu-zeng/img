<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="black"/></marker></defs>
<rect width="1120" height="350" fill="white"/>
<text x="280" y="35" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="23" font-style="normal" fill="black">BINARY ENCODING</text>
<text x="840" y="35" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="23" font-style="normal" fill="black">BIPOLAR ENCODING</text>
<text x="280" y="76" text-anchor="middle" font-family="STIX Two Math,serif" font-size="22" font-style="italic" fill="black">a, b ∈ {0, 1}</text>
<text x="840" y="76" text-anchor="middle" font-family="STIX Two Math,serif" font-size="22" font-style="italic" fill="black">σ = 1 − 2b ∈ {−1, +1}</text>
<rect x="12" y="110" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="62.0" y="146.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">XOR</text>
<rect x="132" y="110" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="337.0" y="146.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">a + b − 2ρ(a + b − 1)</text>
<rect x="572" y="110" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="622.0" y="146.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">XOR</text>
<rect x="692" y="110" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="897.0" y="146.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">σa · σb</text>
<rect x="12" y="184" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="62.0" y="220.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">AND</text>
<rect x="132" y="184" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="337.0" y="220.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">ρ(a + b − 1)</text>
<rect x="572" y="184" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="622.0" y="220.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">AND</text>
<rect x="692" y="184" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="897.0" y="220.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">1 − ρ(−σa − σb)</text>
<rect x="12" y="258" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="62.0" y="294.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">NOT</text>
<rect x="132" y="258" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="337.0" y="294.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">1 − a</text>
<rect x="572" y="258" width="100" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="622.0" y="294.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">NOT</text>
<rect x="692" y="258" width="410" height="58" fill="white" stroke="black" stroke-width="1.4"/>
<text x="897.0" y="294.0" text-anchor="middle" font-family="Times New Roman,STIX Two Text,serif" font-size="22" font-style="normal" fill="black">−σa</text>
</svg>