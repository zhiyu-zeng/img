<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 476" width="982" role="img" aria-labelledby="vsTitle vsDesc"><style>
    .b   { fill:#ffffff; stroke:#26313f; stroke-width:1.6; }
    .layer { fill:#fbfcfe; stroke:#26313f; stroke-width:1.4; }
    .layer2 { fill:#f1f5fb; stroke:#26313f; stroke-width:1.4; }
    .chipwarn { fill:#fff7ec; stroke:#c76a00; stroke-width:1.6; }
    .chipres { fill:#eef3ff; stroke:#2b56d4; stroke-width:1.8; }
    .ln  { stroke:#26313f; stroke-width:1.7; fill:none; }
    .arh { fill:#26313f; }
    .lbl { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:18.5px; }
    .code { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16.5px; }
    .cap { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:16px; }
    .warncap { fill:#a85a00; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .flow { fill:#2b56d4; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .ok { fill:#2b7a2b; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:16.5px; }
    text { text-anchor:middle; }
    .l   { text-anchor:start; }
  </style><defs><marker id="vsArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arh"/></marker><marker id="vsArrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b56d4"/></marker></defs><rect class="b" x="12" y="20" width="436" height="86" rx="8"/><text class="lbl l" x="30" y="47">leaked machineKey derives the keys</text><text class="code l" x="30" y="71">validationKey + decryptionKey,</text><text class="code l" x="30" y="92">via SP800-108</text><line class="ln" x1="230" y1="106" x2="230" y2="126" marker-end="url(#vsArr)"/><rect class="layer" x="12" y="128" width="436" height="320" rx="10"/><text class="lbl l" x="30" y="156">__VIEWSTATE</text><text class="code l" x="30" y="180">IV · AES-CBC · HMAC-SHA1</text><rect class="layer2" x="28" y="196" width="404" height="236" rx="9"/><text class="lbl l" x="46" y="224">LosFormatter</text><rect class="layer" x="44" y="238" width="372" height="178" rx="8"/><text class="lbl l" x="62" y="266">BinaryFormatter gadget chain</text><text class="code l" x="62" y="290">TextFormattingRunProperties</text><rect class="chipwarn" x="60" y="306" width="340" height="94" rx="7"/><text class="lbl l" x="78" y="334">XAML runs a command</text><text class="code l" x="78" y="359">Process.Start → shell.aspx</text><text class="warncap l" x="78" y="383">certutil decodes the webshell</text><line class="ln" x1="448" y1="152" x2="505" y2="152" marker-end="url(#vsArr)"/><text class="flow" x="478" y="142">POST</text><text class="lbl" x="739" y="107">The server unwraps it</text><rect class="b" x="508" y="121" width="462" height="62" rx="6"/><text class="code" x="739" y="147">HMAC-SHA1 checks out <tspan class="ok">✓</tspan></text><text class="cap" x="739" y="169">we forged it with the derived key</text><line class="ln" x1="739" y1="183" x2="739" y2="203" marker-end="url(#vsArr)"/><rect class="b" x="508" y="205" width="462" height="86" rx="6"/><text class="code" x="739" y="231">unwrap the layers,</text><text class="code" x="739" y="252">deserialise the gadget chain</text><text class="cap" x="739" y="274">Process.Start writes shell.aspx</text><line class="ln" x1="739" y1="291" x2="739" y2="311" marker-end="url(#vsArr)"/><rect class="chipwarn" x="508" y="313" width="462" height="62" rx="6"/><text class="code" x="739" y="339">deserialisation then throws → HTTP 500</text><text class="warncap" x="739" y="361">a 500 here is the success signal</text><line class="ln" x1="739" y1="375" x2="739" y2="395" marker-end="url(#vsArrBlue)"/><rect class="chipres" x="508" y="397" width="462" height="66" rx="6"/><text class="code" x="739" y="423">webshell in the web root; once requested,</text><text class="code" x="739" y="445">it runs as iis apppool\telerikpool-v708</text></svg>
