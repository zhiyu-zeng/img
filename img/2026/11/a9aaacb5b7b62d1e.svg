  </style><defs><marker id="upArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arh"/></marker><marker id="upArrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b56d4"/></marker></defs><rect class="b" x="12" y="20" width="436" height="86" rx="8"/><text class="lbl l" x="30" y="47">leaked DialogParametersEncryptionKey</text><text class="code l" x="30" y="71">decrypt the dp, forge its contents,</text><text class="code l" x="30" y="92">re-encrypt</text><line class="ln" x1="230" y1="106" x2="230" y2="126" marker-end="url(#upArr)"/><rect class="layer" x="12" y="128" width="436" height="250" rx="10"/><text class="lbl l" x="30" y="156">forged dp</text><text class="code l" x="30" y="180">AES-GCM envelope, re-signed with the key</text><rect class="layerbad" x="28" y="196" width="404" height="166" rx="9"/><text class="lbl l" x="46" y="224">tampered fields</text><text class="code l" x="46" y="250">ViewPaths, UploadPaths = ~/</text><text class="code l" x="46" y="274">SearchPatterns = *.*</text><text class="badcap l" x="46" y="302">the file browser lists and writes</text><text class="badcap l" x="46" y="324">to the web root and accepts any</text><text class="badcap l" x="46" y="346">file extension</text><line class="ln" x1="448" y1="152" x2="505" y2="152" marker-end="url(#upArr)"/><text class="flow" x="478" y="142">POST</text><text class="lbl" x="739" y="107">The server trusts it</text><rect class="b" x="508" y="121" width="462" height="62" rx="6"/><text class="code" x="739" y="147">RadFileExplorer scoped to ~/</text><text class="badcap" x="739" y="169">paths taken from the dp, never validated</text><line class="ln" x1="739" y1="183" x2="739" y2="203" marker-end="url(#upArr)"/><rect class="chipwarn" x="508" y="205" width="462" height="62" rx="6"/><text class="code" x="739" y="231">async-upload shell.aspx via ?type=rau</text><text class="warncap" x="739" y="253">prefix check only, no extension check</text><line class="ln" x1="739" y1="267" x2="739" y2="287" marker-end="url(#upArrBlue)"/><rect class="chipres" x="508" y="289" width="462" height="66" rx="6"/><text class="code" x="739" y="315">shell.aspx in the web root; once requested,</text><text class="code" x="739" y="337">it runs as iis apppool\telerikpool-v708</text></svg>
