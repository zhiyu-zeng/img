<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 470" width="1102" height="470" role="img" aria-labelledby="rbTitle rbDesc">
  <title id="rbTitle">Decrypting a two-block CBC message</title>
  <desc id="rbDesc">Two ciphertext blocks are each decrypted by the block cipher into an intermediate value. Block 1 is XORed with the IV and block 2 with ciphertext block 1, giving the plaintext JSON object {"uid":1,"username":"admin"} followed by four bytes of PKCS#7 padding, which the server parses successfully.</desc>
