    .lnred   { stroke:#d64545; stroke-width:1.9; fill:none; }
    .cbarrow { stroke:#d64545; stroke-width:1.9; fill:none; }
    text { text-anchor:middle; }
    .l   { text-anchor:start; }
  </style><defs><marker id="hrArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arh"/></marker><marker id="hrArrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b56d4"/></marker><marker id="hrArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect class="b" x="10" y="100" width="265" height="232" rx="8"/><text class="lbl" x="142.5" y="128">somepage.aspx</text><rect class="grpblue" x="22" y="144" width="241" height="120" rx="8"/><text class="tag l" x="34" y="172">&lt;telerik:RadImageEditor&gt;</text><text class="tag l" x="34" y="198">&lt;telerik:RadAsyncUpload&gt;</text><text class="tag l" x="34" y="224">&lt;telerik:RadBinaryImage&gt;</text><text class="tag l" x="34" y="250">&lt;telerik: ... &gt;</text><rect class="grpred" x="22" y="280" width="241" height="36" rx="8"/><text class="tag l" x="34" y="304">&lt;telerik:RadEditor&gt;</text><rect class="dll" x="315" y="18" width="759" height="522" rx="14"/><text class="lbl" x="694.5" y="46">Telerik.Web.UI.dll</text><text class="cap" x="694.5" y="68">one assembly, every control and handler lives inside it</text><rect class="b" x="333" y="129" width="195" height="64" rx="8"/><text class="lbl" x="430.5" y="156">WebResource.axd</text><text class="cap" x="430.5" y="178">?type=&lt;handler_key&gt;</text><line class="ln" x1="528" y1="161" x2="560" y2="161" marker-end="url(#hrArr)"/><rect class="b" x="562" y="129" width="168" height="64" rx="8"/><text class="lbl" x="646" y="156">HandlerRouter</text><text class="cap" x="646" y="178">dispatch by type</text><path class="ln" d="M730,161 H748"/><path class="ln" d="M748,104 V238"/><circle class="dot" cx="748" cy="161" r="3"/><line class="ln" x1="748" y1="104" x2="764" y2="104" marker-end="url(#hrArr)"/><line class="ln" x1="748" y1="142" x2="764" y2="142" marker-end="url(#hrArr)"/><line class="ln" x1="748" y1="180" x2="764" y2="180" marker-end="url(#hrArr)"/><line class="ln" x1="748" y1="238" x2="764" y2="238" marker-end="url(#hrArr)"/><rect class="chiphi" x="766" y="88" width="294" height="32" rx="6"/><text class="hi l" x="778" y="109">ImageEditorCacheHandler (iec)</text><rect class="chip" x="766" y="126" width="294" height="32" rx="6"/><text class="item l" x="778" y="147">RadAsyncUpload (rau)</text><rect class="chip" x="766" y="164" width="294" height="32" rx="6"/><text class="item l" x="778" y="185">RadBinaryImage (rbi)</text><text class="ell" x="913" y="212">. . .</text><rect class="chipother" x="766" y="222" width="294" height="32" rx="6"/><text class="itemmuted l" x="778" y="243">other type-routed handlers</text><rect class="b" x="333" y="374" width="218" height="84" rx="8"/><text class="lbl" x="442" y="401">DialogHandler.aspx</text><text class="cap" x="442" y="423">?DialogName=&lt;dialog&gt;</text><text class="cap" x="442" y="445">dp=&lt;encrypted_params&gt;</text><line class="ln" x1="551" y1="416" x2="748" y2="416" marker-end="url(#hrArr)"/><text class="cap" x="650" y="407">decrypted parameters</text><rect class="rebox" x="752" y="310" width="298" height="212" rx="10"/><text class="lbl" x="901" y="336">RadEditor</text><rect class="chip" x="766" y="348" width="270" height="30" rx="5"/><text class="item l" x="778" y="368">image editor</text><rect class="chip" x="766" y="386" width="270" height="30" rx="5"/><text class="item l" x="778" y="406">document manager</text><rect class="chip" x="766" y="424" width="270" height="30" rx="5"/><text class="item l" x="778" y="444">RadFileExplorer</text><text class="ell" x="901" y="469">. . .</text><rect class="chipother" x="766" y="478" width="270" height="30" rx="5"/><text class="itemmuted l" x="778" y="498">other RadEditor dialogs</text><path class="cbarrow" d="M901,310 V290 H430.5 V195" marker-end="url(#hrArrRed)"/><text class="cbcap" x="666" y="282">the ImageEditor dialog reads back through iec</text><text class="cap" x="694.5" y="566">The ImageEditorCacheHandler (iec) is the read sink.</text><text class="cap" x="694.5" y="588">Any RadEditor page reaches it through the ImageEditor dialog.</text><path class="lnblue" d="M263,204 H295 V161 H331" marker-end="url(#hrArrBlue)"/><path class="lnred" d="M263,298 H295 V416 H331" marker-end="url(#hrArrRed)"/></svg>
