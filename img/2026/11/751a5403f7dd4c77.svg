<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 602" width="1084" role="img" aria-labelledby="hrTitle hrDesc"><style>
    /* Self-contained, light-background palette. As an &lt;img&gt; this SVG is fully
       sandboxed: these styles apply only inside this file and never touch the page. */
    .b   { fill:#ffffff; stroke:#26313f; stroke-width:1.6; }
    .dll { fill:#f6f8fc; stroke:#26313f; stroke-width:1.4; stroke-dasharray:6 5; }
