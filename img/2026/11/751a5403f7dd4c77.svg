    .tag { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; }
    .hi  { fill:#2b56d4; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:15.5px; }
    .cap { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:15px; }
