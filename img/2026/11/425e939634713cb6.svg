<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1174" width="900" role="img" aria-labelledby="dlTitle dlDesc"><style>
    /* Self-contained, light-background palette. As an &lt;img&gt; this SVG is fully
       sandboxed: these styles apply only inside this file and never touch the page. */
    .b    { fill:#ffffff; stroke:#26313f; stroke-width:1.6; }
    .band { fill:#f6f8fc; stroke:none; }
    .entry{ fill:#ffffff; stroke:#2b56d4; stroke-width:1.6; }
    .notebad  { fill:#fdf3f3; stroke:#d64545; stroke-width:1.6; }
    .notewarn { fill:#fff7ec; stroke:#c76a00; stroke-width:1.6; }
    .life { stroke:#8a97a6; stroke-width:1.4; fill:none; stroke-dasharray:3 5; }
    .lifehot { stroke:#2b56d4; stroke-width:3; fill:none; }
    .call { stroke:#2b56d4; stroke-width:1.8; fill:none; }
    .ret  { stroke:#2b56d4; stroke-width:1.8; fill:none; stroke-dasharray:6 5; }
    .lbl  { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:18.5px; }
    .code { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16.5px; }
    .flow { fill:#2b56d4; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:16.5px; }
    .sub  { fill:#556270; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; }
    .cap  { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:16px; }
    .phase{ fill:#26313f; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16.5px; }
    .badcap  { fill:#c03535; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .warncap { fill:#a85a00; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .halo { paint-order:stroke; stroke:#f6f8fc; stroke-width:7px; stroke-linejoin:round; }
    text { text-anchor:middle; }
    .l { text-anchor:start; }
  </style><defs><marker id="dlCall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b56d4"/></marker></defs><rect class="band" x="18" y="108" width="964" height="164" rx="12"/><rect class="band" x="18" y="286" width="964" height="546" rx="12"/><rect class="band" x="18" y="846" width="964" height="314" rx="12"/><line class="life" x1="130" y1="102" x2="130" y2="1160"/><line class="life" x1="500" y1="102" x2="500" y2="1160"/><line class="life" x1="860" y1="102" x2="860" y2="1160"/><line class="lifehot" x1="860" y1="618" x2="860" y2="1008"/><text class="phase halo l" x="34" y="134">Phase 1 · harvest the dp for an ImageEditor dialog from any RadEditor page</text><text class="phase halo l" x="34" y="312">Phase 2 · poison the cache through the dialog</text><text class="phase halo l" x="34" y="872">Phase 3 · read it back through iec</text><rect class="b" x="55" y="20" width="150" height="50" rx="8"/><text class="lbl" x="130" y="52">Adversary</text><text class="cap" x="130" y="90">unauthenticated</text><rect class="b" x="380" y="20" width="240" height="50" rx="8"/><text class="lbl" x="500" y="52">Telerik server</text><text class="cap" x="500" y="90">RadEditor page · DialogHandler · iec</text><rect class="b" x="750" y="20" width="220" height="50" rx="8"/><text class="lbl" x="860" y="52">HttpRuntime.Cache</text><text class="flow" x="315" y="176">① GET a RadEditor page</text><line class="call" x1="134" y1="190" x2="496" y2="190" marker-end="url(#dlCall)"/><text class="flow" x="315" y="240">② page HTML carries the dp</text><line class="ret" x1="496" y1="254" x2="134" y2="254" marker-end="url(#dlCall)"/><text class="flow" x="315" y="354">③ POST DialogHandler.aspx</text><text class="sub" x="315" y="374">dp + OriginalImageLocation=</text><text class="sub" x="315" y="394">~/web.config</text><line class="call" x1="134" y1="404" x2="496" y2="404" marker-end="url(#dlCall)"/><rect class="notebad" x="320" y="418" width="360" height="60" rx="6"/><text class="code" x="500" y="442">imgEditor.ImageUrl = ~/web.config</text><text class="badcap" x="500" y="464">plain form field, outside the dp</text><path class="call" d="M504,500 H588 V546 H508" marker-end="url(#dlCall)"/><text class="flow l" x="600" y="512">④ content provider fetch</text><text class="sub l" x="600" y="532">GetFile(~/web.config)</text><text class="sub l" x="600" y="552">exists ✓</text><text class="flow" x="680" y="588">⑤ StoreDownloadKey</text><text class="sub" x="680" y="608">caches GUID → ~/web.config</text><line class="call" x1="504" y1="618" x2="856" y2="618" marker-end="url(#dlCall)"/><rect class="entry" x="750" y="628" width="220" height="46" rx="6"/><text class="code" x="860" y="657">GUID → ~/web.config</text><text class="cap halo" x="860" y="696">held until the read</text><text class="flow" x="680" y="720">⑥ GUID</text><text class="sub" x="680" y="740">the key to the entry</text><line class="ret" x1="856" y1="750" x2="504" y2="750" marker-end="url(#dlCall)"/><text class="flow" x="315" y="784">⑦ _downloadKey</text><text class="sub" x="315" y="804">encrypted GUID</text><line class="ret" x1="496" y1="814" x2="134" y2="814" marker-end="url(#dlCall)"/><text class="flow" x="315" y="914">⑧ POST _downloadKey</text><text class="sub" x="315" y="934">WebResource.axd?type=iec</text><line class="call" x1="134" y1="944" x2="496" y2="944" marker-end="url(#dlCall)"/><text class="flow" x="680" y="978">⑨ ResolveFilePathFromKey</text><text class="sub" x="680" y="998">cache returns ~/web.config</text><line class="ret" x1="856" y1="1008" x2="504" y2="1008" marker-end="url(#dlCall)"/><rect class="notewarn" x="360" y="1022" width="280" height="60" rx="6"/><text class="code" x="500" y="1046">StartsWith(app root)? ✓</text><text class="warncap" x="500" y="1068">app-root check</text><text class="flow" x="315" y="1112">⑩ GetImageFromFileSystem</text><text class="sub" x="315" y="1132">raw bytes of ~/web.config</text><line class="ret" x1="496" y1="1142" x2="134" y2="1142" marker-end="url(#dlCall)"/></svg>
