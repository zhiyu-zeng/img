<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 690 580" width="860" height="723" role="img" aria-labelledby="padTitle padDesc">
  <title id="padTitle">Valid and invalid PKCS#7 padding on 16-byte blocks</title>
  <desc id="padDesc">Five decrypted 16-byte blocks. A block ending 02 02 and one ending 03 03 03 are valid. A block that is a full block of the byte 10 is valid, the padding added when the message is already a whole number of blocks. A block ending 03 03 02 is invalid because the last byte 02 requires the final two bytes to both be 02. A block whose last byte is 0xcc is invalid because 0xcc is not a valid padding length.</desc>
