    .cell { fill:#ffffff; stroke:#26313f; stroke-width:1.5; }
    .good { fill:#2f9e44; fill-opacity:0.16; stroke:#2f9e44; stroke-width:1.5; }
    .bad  { fill:#e03131; fill-opacity:0.16; stroke:#e03131; stroke-width:1.5; }
    .hex  { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:13px; text-anchor:middle; }
    .rule { fill:#26313f; font-family:system-ui,-apple-system,sans-serif; font-weight:600; font-size:12.5px; text-anchor:middle; }
    .lb   { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:10.5px; text-anchor:middle; }
    .sg   { fill:#2f9e44; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:11.5px; text-anchor:middle; }
    .sb   { fill:#e03131; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:11.5px; text-anchor:middle; }
    .vg   { fill:#2f9e44; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12.5px; }
    .vb   { fill:#e03131; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:12.5px; }
    .rsn  { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:11.5px; }
    .brg  { stroke:#2f9e44; stroke-width:1.7; fill:none; }
    .brb  { stroke:#e03131; stroke-width:1.7; fill:none; }
    .ptr  { stroke:#556270; stroke-width:1.4; fill:none; }
    text  { text-anchor:middle; }
  </style>
