<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 1088 426" width="1088" height="426" role="img" aria-labelledby="rmTitle rmDesc">
  <title id="rmTitle">Growing the pad to two valid bytes</title>
  <desc id="rmDesc">The last controlled byte is pinned so the target block ends in 0x02, then the next byte to the left is cycled until the target ends in a valid two-byte pad 0x02 0x02. Its intermediate is recovered as the controlled byte XOR 0x02, and the real plaintext byte as the original ciphertext byte XOR the intermediate.</desc>
