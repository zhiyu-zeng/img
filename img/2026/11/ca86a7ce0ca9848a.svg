<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="900" role="img" aria-labelledby="ieTitle ieDesc"><style>
    /* Self-contained, light-background palette. As an &lt;img&gt; this SVG is fully
       sandboxed: these styles apply only inside this file and never touch the page. */
    .b    { fill:#ffffff; stroke:#26313f; stroke-width:1.6; }
    .band { fill:#f6f8fc; stroke:none; }
    .entry{ fill:#ffffff; stroke:#2b56d4; stroke-width:1.6; }
    .notebad  { fill:#fdf3f3; stroke:#d64545; stroke-width:1.6; }
    .notewarn { fill:#fff7ec; stroke:#c76a00; stroke-width:1.6; }
    .life { stroke:#8a97a6; stroke-width:1.4; fill:none; stroke-dasharray:3 5; }
    .lifehot { stroke:#2b56d4; stroke-width:3; fill:none; }
    .call { stroke:#2b56d4; stroke-width:1.8; fill:none; }
    .ret  { stroke:#2b56d4; stroke-width:1.8; fill:none; stroke-dasharray:6 5; }
    .lbl  { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:18.5px; }
    .code { fill:#26313f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16.5px; }
    .flow { fill:#2b56d4; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:16.5px; }
    .sub  { fill:#556270; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; }
    .cap  { fill:#556270; font-family:system-ui,-apple-system,sans-serif; font-size:16px; }
    .phase{ fill:#26313f; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16.5px; }
    .badcap  { fill:#c03535; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .warncap { fill:#a85a00; font-family:system-ui,-apple-system,sans-serif; font-weight:700; font-size:16px; }
    .halo { paint-order:stroke; stroke:#f6f8fc; stroke-width:7px; stroke-linejoin:round; }
    text { text-anchor:middle; }
    .l { text-anchor:start; }
  </style><defs><marker id="ieCall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b56d4"/></marker></defs><rect class="band" x="18" y="108" width="964" height="526" rx="12"/><rect class="band" x="18" y="648" width="964" height="378" rx="12"/><line class="life" x1="130" y1="102" x2="130" y2="1026"/><line class="life" x1="500" y1="102" x2="500" y2="1026"/><line class="life" x1="860" y1="102" x2="860" y2="1026"/><line class="lifehot" x1="860" y1="420" x2="860" y2="874"/><text class="phase halo l" x="34" y="134">Phase 1 · poison the download cache</text><text class="phase halo l" x="34" y="674">Phase 2 · read it back through iec using the poisoned _downloadKey</text><rect class="b" x="55" y="20" width="150" height="50" rx="8"/><text class="lbl" x="130" y="52">Adversary</text><text class="cap" x="130" y="90">unauthenticated</text><rect class="b" x="400" y="20" width="200" height="50" rx="8"/><text class="lbl" x="500" y="52">Telerik server</text><text class="cap" x="500" y="90">RadImageEditor · cache handler</text><rect class="b" x="750" y="20" width="220" height="50" rx="8"/><text class="lbl" x="860" y="52">HttpRuntime.Cache</text><text class="flow" x="315" y="176">① POST poisoned _ClientState</text><text class="sub" x="315" y="196">imageUrl = ~/web.config</text><line class="call" x1="134" y1="206" x2="496" y2="206" marker-end="url(#ieCall)"/><rect class="notebad" x="340" y="220" width="320" height="60" rx="6"/><text class="code" x="500" y="244">LoadClientState sets ImageUrl</text><text class="badcap" x="500" y="266">no decrypt, no MAC</text><path class="call" d="M504,302 H588 V348 H508" marker-end="url(#ieCall)"/><text class="flow l" x="600" y="314">② content provider fetch</text><text class="sub l" x="600" y="334">GetFile(~/web.config)</text><text class="sub l" x="600" y="354">exists ✓</text><text class="flow" x="680" y="390">③ StoreDownloadKey</text><text class="sub" x="680" y="410">inserts the cache entry</text><line class="call" x1="504" y1="420" x2="856" y2="420" marker-end="url(#ieCall)"/><rect class="entry" x="750" y="430" width="220" height="46" rx="6"/><text class="code" x="860" y="459">GUID → ~/web.config</text><text class="cap halo" x="860" y="498">held across both phases</text><text class="flow" x="680" y="522">④ GUID</text><text class="sub" x="680" y="542">the key to the entry</text><line class="ret" x1="856" y1="552" x2="504" y2="552" marker-end="url(#ieCall)"/><text class="flow" x="315" y="586">⑤ _downloadKey</text><text class="sub" x="315" y="606">encrypted GUID</text><line class="ret" x1="496" y1="616" x2="134" y2="616" marker-end="url(#ieCall)"/><text class="flow" x="315" y="716">⑥ POST _downloadKey</text><text class="sub" x="315" y="736">WebResource.axd?type=iec</text><line class="call" x1="134" y1="746" x2="496" y2="746" marker-end="url(#ieCall)"/><text class="flow" x="680" y="780">⑦ ResolveFilePathFromKey</text><text class="sub" x="680" y="800">looks up the GUID</text><line class="call" x1="504" y1="810" x2="856" y2="810" marker-end="url(#ieCall)"/><text class="flow" x="680" y="844">⑧ ~/web.config</text><text class="sub" x="680" y="864">the poisoned path</text><line class="ret" x1="856" y1="874" x2="504" y2="874" marker-end="url(#ieCall)"/><rect class="notewarn" x="360" y="888" width="280" height="60" rx="6"/><text class="code" x="500" y="912">StartsWith(app root)? ✓</text><text class="warncap" x="500" y="934">app-root check only</text><text class="flow" x="315" y="978">⑨ GetImageFromFileSystem</text><text class="sub" x="315" y="998">raw bytes of ~/web.config returned</text><line class="ret" x1="496" y1="1008" x2="134" y2="1008" marker-end="url(#ieCall)"/></svg>
